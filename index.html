<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strategic Target Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
    :root {
      --bg: #000000; --bg-card: #111418; --bg-elevated: #1C2128; --text: #F0F6FC; --sub: #8B949E;
      --border: #30363D; --accent: #58A6FF; --accent-bg: rgba(88, 166, 255, 0.15);
      --yellow: #D29922; --yellow-bg: rgba(210, 153, 34, 0.15); --red: #F85149; --red-bg: rgba(248, 81, 73, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); overscroll-behavior-y: none; }

    /* Lock Screen */
    #gumroad-lock { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; transition: opacity 0.4s ease; }
    #gumroad-lock.unlocked { opacity: 0; pointer-events: none; }
    .lock-box { background: var(--bg-card); border: 1px solid var(--border); padding: 32px; border-radius: 16px; width: 100%; max-width: 400px; }
    .lock-input { width: 100%; padding: 16px; margin: 16px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); text-align: center; font-family: 'JetBrains Mono'; font-size: 16px; }
    .lock-btn { width: 100%; padding: 16px; border-radius: 8px; border: none; background: var(--accent); color: #000; font-weight: 700; cursor: pointer; }

    /* Dashboard */
    #dashboard { display: flex; flex-direction: column; height: 100vh; }
    .app-header { padding: 40px 20px 20px; border-bottom: 1px solid var(--border); }
    .target-list { flex: 1; overflow-y: auto; padding: 20px; gap: 12px; display: flex; flex-direction: column; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
    .fab { position: fixed; bottom: 30px; right: 20px; width: 56px; height: 56px; border-radius: 28px; background: var(--accent); font-size: 32px; border: none; z-index: 20; }
    
    /* Modal */
    #edit-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 100; transform: translateY(100%); transition: transform 0.35s; display: flex; flex-direction: column; }
    #edit-modal.open { transform: translateY(0); }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .input-field { background: var(--bg-elevated); border: 1px solid var(--border); padding: 14px; color: var(--text); border-radius: 8px; font-size: 16px; }
  </style>
</head>
<body>

  <div id="gumroad-lock">
    <div class="lock-box">
      <div style="font-family: monospace; font-size: 20px; margin-bottom: 10px;">TARGET BOARD</div>
      <p style="color: var(--sub); margin-bottom: 20px;">Enter your license key to unlock.</p>
      <input type="text" id="license-key-input" class="lock-input" placeholder="LICENSE KEY">
      <button class="lock-btn" id="verify-btn" onclick="verifyGumroadKey()">Unlock</button>
      <div id="lock-error" style="color: var(--red); margin-top: 10px; display: none;">Invalid key.</div>
    </div>
  </div>

  <div id="dashboard">
    <div class="app-header">
      <div style="font-weight: 700;">STRATEGIC TARGET BOARD</div>
    </div>
    <div class="target-list" id="targetList"></div>
    <button class="fab" onclick="openModal()">+</button>
  </div>

  <div id="edit-modal">
    <div style="padding: 20px; display: flex; justify-content: space-between;">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="saveTarget()">Save</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <textarea id="f-target" class="input-field" placeholder="Company / Position"></textarea>
      <input type="text" id="f-link" class="input-field" placeholder="Job Link">
      <button class="btn-danger" style="background: var(--red-bg); color: var(--red); padding: 16px; border-radius: 8px; border: none;" onclick="deleteTarget()">Delete</button>
    </div>
  </div>

  <script>
    const GUMROAD_PRODUCT_ID = "F5iQ0zfPau2H0EpW3XZmxg=="; 
    let targets = JSON.parse(localStorage.getItem('jobBoard_Data') || '[]');

    // --- LICENSE ---
    async function verifyGumroadKey() {
      const key = document.getElementById('license-key-input').value.trim();
      const btn = document.getElementById('verify-btn');
      if (!key) return;
      btn.innerText = "Verifying...";
      try {
        const response = await fetch("https://api.gumroad.com/v2/licenses/verify", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ product_id: GUMROAD_PRODUCT_ID, license_key: key })
        });
        const data = await response.json();
        if (data.success && !data.purchase.refunded) {
          localStorage.setItem('gumroad_valid_key', key);
          unlockApp();
        } else {
          document.getElementById('lock-error').style.display = "block";
        }
      } catch (e) { alert("Network error"); }
      btn.innerText = "Unlock";
    }

    function unlockApp() {
      document.getElementById('gumroad-lock').classList.add('unlocked');
      renderDashboard();
    }

    // --- DASHBOARD ---
    function renderDashboard() {
      const list = document.getElementById('targetList');
      list.innerHTML = "";
      targets.forEach(t => {
        let card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(t.id);
        card.innerHTML = `<div class="card-title">${t.target}</div>`;
        list.appendChild(card);
      });
    }

    function openModal(id) { document.getElementById('edit-modal').classList.add('open'); }
    function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }
    function saveTarget() { 
        // Logic to push to targets array
        targets.push({id: Math.random(), target: document.getElementById('f-target').value});
        localStorage.setItem('jobBoard_Data', JSON.stringify(targets));
        renderDashboard();
        closeModal(); 
    }
    function deleteTarget() { closeModal(); }

    window.onload = () => {
      if (localStorage.getItem('gumroad_valid_key')) unlockApp();
    };
  </script>
</body>
</html>
