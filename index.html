<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strategic Target Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

    :root {
      --bg: #000000;
      --bg-card: #111418;
      --bg-elevated: #1C2128;
      --text: #F0F6FC;
      --sub: #8B949E;
      --border: #30363D;
      --accent: #58A6FF;
      --accent-bg: rgba(88, 166, 255, 0.15);
      --green: #2EA043;
      --yellow: #D29922;
      --red: #F85149;
      --red-bg: rgba(248, 81, 73, 0.15);
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body { font-family: var(--font-sans); background-color: var(--bg); color: var(--text); overscroll-behavior-y: none; line-height: 1.5; }

    /* ── GUMROAD LOCK SCREEN ── */
    #gumroad-lock {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      transition: opacity 0.4s ease;
    }
    #gumroad-lock.unlocked { opacity: 0; pointer-events: none; }
    .lock-box {
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 32px 24px; border-radius: 16px; max-width: 400px; width: 100%;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .lock-title { font-family: var(--font-mono); font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .lock-title span { color: var(--accent); }
    .lock-desc { font-size: 14px; color: var(--sub); margin-bottom: 24px; line-height: 1.5; }
    .lock-input {
      width: 100%; padding: 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text); font-family: var(--font-mono);
      font-size: 16px; margin-bottom: 16px; outline: none; text-align: center;
    }
    .lock-btn {
      width: 100%; padding: 16px; border-radius: 8px; border: none;
      background: var(--accent); color: #000; font-family: var(--font-mono);
      font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer;
    }
    .lock-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }

    /* ... [Rest of your styles go here] ... */
    
    /* (Adding the existing styles from your mobile-optimized file here) */
    /* Note: Since this is a long file, ensure you paste all previous styles after the lock screen CSS */
  </style>
</head>
<body>

  <div id="gumroad-lock">
    <div class="lock-box">
      <div class="lock-title">Target <span>Board</span></div>
      <div class="lock-desc">Enter the license key sent to your email after purchase to unlock the dashboard.</div>
      <input type="text" id="license-key-input" class="lock-input" placeholder="LICENSE KEY">
      <button class="lock-btn" id="verify-btn" onclick="verifyGumroadKey()">Unlock App</button>
      <div class="lock-error" id="lock-error">Invalid license key. Please check your email.</div>
    </div>
  </div>

  <script>
    // --- GUMROAD LICENSING ---
    const GUMROAD_PRODUCT_ID = "F5iQ0zfPau2H0EpW3XZmxg=="; // YOUR PRODUCT ID

    async function verifyGumroadKey() {
      const keyInput = document.getElementById('license-key-input').value.trim();
      const btn = document.getElementById('verify-btn');
      const errorMsg = document.getElementById('lock-error');
      
      if (!keyInput) return;

      btn.innerText = "Verifying...";
      errorMsg.style.display = "none";

      try {
        const response = await fetch("https://api.gumroad.com/v2/licenses/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            product_id: GUMROAD_PRODUCT_ID,
            license_key: keyInput
          })
        });

        const data = await response.json();

        if (data.success && !data.purchase.refunded && !data.purchase.chargebacked) {
          localStorage.setItem('gumroad_valid_key', keyInput);
          unlockApp();
        } else {
          showError("Invalid or refunded license key.");
          localStorage.removeItem('gumroad_valid_key');
        }
      } catch (error) {
        showError("Network error. Please try again.");
      }
      btn.innerText = "Unlock App";
    }

    function showError(msg) {
      const errorMsg = document.getElementById('lock-error');
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    }

    function unlockApp() {
      document.getElementById('gumroad-lock').classList.add('unlocked');
    }

    function checkExistingLicense() {
      const savedKey = localStorage.getItem('gumroad_valid_key');
      if (savedKey) unlockApp();
    }

    // Call this at the start of your window.onload
    checkExistingLicense();

    // --- [REST OF YOUR EXISTING JS GOES HERE] ---
  </script>
</body>
</html>
